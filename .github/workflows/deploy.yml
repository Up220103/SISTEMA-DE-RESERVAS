# =============================================================================
#  CI/CD · Sistema de Reservas UPA  ·  imagen "TODO EN UNO"
#
#  qa      -> siempre (PR y push). Pruebas de backend y frontend + build.
#  deploy  -> solo push a main. Construye la imagen combinada (front+back+MySQL),
#             la sube a ACR, la despliega en el App Service y valida /health.
#
#  qa dispara tambien en push a main a proposito: un job con `needs:` se SALTA
#  si su dependencia no corrio, asi que si qa solo corriera en PR el push a main
#  dejaria deploy sin ejecutarse.
# =============================================================================
name: CI/CD - Sistema de Reservas

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop]

env:
  RESOURCE_GROUP: rg-sistemadereserva
  ACR_NAME: acrsistemareservasupa
  ACR_LOGIN_SERVER: acrsistemareservasupa.azurecr.io
  # App Service donde vive el contenedor todo-en-uno.
  WEBAPP: sistema-reservas-api-upa
  IMAGE: sistema-reservas/app

jobs:
  # ===========================================================================
  #  ETAPA 1 · Q/A - pruebas y build (runner gratuito de GitHub)
  # ===========================================================================
  qa:
    name: Q/A - Pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---- Backend ----
      - name: Backend · Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Backend · Validar sintaxis
        working-directory: backend
        run: find src -name '*.js' -exec node --check {} +

      - name: Backend · Pruebas
        working-directory: backend
        run: npm test

      # ---- Frontend ----
      - name: Frontend · Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Frontend · Pruebas
        working-directory: frontend
        run: npm test

      - name: Frontend · Build de produccion
        working-directory: frontend
        run: npm run build

  # ===========================================================================
  #  ETAPA 2 · Construir la imagen combinada, subirla y desplegar
  # ===========================================================================
  deploy:
    name: Deploy a Azure App Service
    needs: qa
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Iniciar sesion en ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Construir y subir la imagen todo-en-uno
        # Dos tags: run_id (para rollback exacto) y latest.
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}:${{ github.run_id }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}:latest \
            .
          docker push --all-tags ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}

      - name: Aplicar configuracion del App Service
        # WEBSITES_PORT=80 -> nginx. Fijamos tambien DB_* a la BD INTERNA del
        # contenedor: si quedaron app settings viejos apuntando a una MySQL que
        # ya no existe, en App Service esos sobreescriben la ENV de la imagen y
        # romperian la conexion. Aqui los forzamos a los valores internos.
        run: |
          az webapp config appsettings set \
            --name ${{ env.WEBAPP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings \
              WEBSITES_PORT=80 \
              WEBSITES_CONTAINER_START_TIME_LIMIT=600 \
              NODE_ENV=production \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              DB_HOST=127.0.0.1 \
              DB_PORT=3306 \
              DB_USER=root \
              DB_PASSWORD=root \
              DB_NAME=reservas_upa \
              DB_SSL=false \
              CORS_ORIGIN="*" \
            --output none

      - name: Desplegar el contenedor
        run: |
          az webapp config container set \
            --name ${{ env.WEBAPP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-image-name ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE }}:${{ github.run_id }} \
            --container-registry-url https://${{ env.ACR_LOGIN_SERVER }} \
            --output none
          az webapp restart \
            --name ${{ env.WEBAPP }} \
            --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Smoke test · /health
        # Primer arranque en Azure: MySQL se inicializa y siembra, puede tardar.
        # Reintentamos hasta 4 minutos.
        run: |
          URL="https://${{ env.WEBAPP }}.azurewebsites.net/health"
          for intento in $(seq 1 48); do
            codigo=$(curl -s -o /tmp/health.json -w "%{http_code}" "$URL" || echo "000")
            if [ "$codigo" = "200" ]; then
              echo "App responde OK:"; cat /tmp/health.json; exit 0
            fi
            echo "Intento $intento/48 · HTTP $codigo · reintentando en 5s..."
            sleep 5
          done
          echo "::error::La app no respondio 200 en /health tras 4 minutos."
          exit 1

      - name: Resumen del despliegue
        run: |
          {
            echo "### Despliegue completado"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | https://${{ env.WEBAPP }}.azurewebsites.net |"
            echo "| Health | https://${{ env.WEBAPP }}.azurewebsites.net/health |"
            echo "| Tag | \`${{ github.run_id }}\` |"
          } >> $GITHUB_STEP_SUMMARY
