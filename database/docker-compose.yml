# =============================================================================
#  Docker Compose · SOLO la base de datos "reservas_upa"
#  Util si quieres correr backend y frontend con `npm run dev` fuera de Docker.
#  Para levantar el sistema completo usa el docker-compose.yml de la raiz.
#
#  Uso (desde esta carpeta):
#    docker compose up -d
#    docker compose logs -f mysql-upa
#    docker compose down        (conserva los datos)
#    docker compose down -v     (borra los datos y vuelve a correr el .sql)
# =============================================================================

services:
  mysql-upa:
    image: mysql:8.0
    container_name: reservas-upa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_upa_data:/var/lib/mysql
      # El script esta junto a este compose. Solo se ejecuta la primera vez,
      # cuando el volumen esta vacio.
      - ./sistema_reservas_upa.sql:/docker-entrypoint-initdb.d/01-sistema_reservas_upa.sql:ro
    # skip-character-set-client-handshake fuerza utf8mb4 aunque el cliente pida
    # otra cosa. Sin esto, el cliente `mysql` del entrypoint lee el .sql como
    # latin1 y los acentos quedan doble-codificados ("García" -> "GarcÃ­a").
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  mysql_upa_data:
    driver: local
