# =============================================================================
#  Reverse proxy TLS · Sistema de Reservas UPA
#  Nginx termina el HTTPS con los certificados de la CA privada y reenvía en
#  HTTP a los contenedores internos (que NO exponen puertos al host).
#
#    front.reservas.com  ->  contenedor `frontend` (nginx estático, :80)
#    back.reservas.com   ->  contenedor `backend`  (Node/Express, :4000)
#    bd.reservas.com     ->  contenedor `db` (MySQL, :3306)  [opcional, ver stream]
#
#  Los certificados se montan en /etc/nginx/certs (volumen -> ./certs).
# =============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Ajustes TLS comunes (modernos y compatibles con navegadores actuales).
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # Sube el límite para las descargas de PDF de reportes.
    client_max_body_size 20m;

    # ---- Redirección 80 -> 443 (todo el tráfico va cifrado) ----------------
    server {
        listen 80;
        server_name front.reservas.com back.reservas.com;
        return 301 https://$host$request_uri;
    }

    # ---- FRONTEND: front.reservas.com --------------------------------------
    server {
        listen 443 ssl;
        server_name front.reservas.com;

        ssl_certificate     /etc/nginx/certs/front.reservas.com/fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/front.reservas.com/privkey.key;

        # HSTS: una vez que confían en la CA, el navegador exige HTTPS.
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass         http://frontend:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ---- BACKEND: back.reservas.com ----------------------------------------
    server {
        listen 443 ssl;
        server_name back.reservas.com;

        ssl_certificate     /etc/nginx/certs/back.reservas.com/fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/back.reservas.com/privkey.key;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass         http://backend:4000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket para Socket.IO (notificaciones en tiempo real).
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}

