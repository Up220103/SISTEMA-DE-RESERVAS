# nginx del contenedor "todo en uno": sirve el frontend estatico y hace de
# proxy hacia el backend Node (mismo contenedor, 127.0.0.1:4000).
# Como frontend y API quedan en el MISMO origen, no hay problemas de CORS.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # /api/... y /health van al backend Node.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    # SPA: cualquier ruta desconocida cae en index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
